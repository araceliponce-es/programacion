<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>

  <div class="padre">
    <div class="rosa "></div>

    <div class="violeta violeta--1"></div>
    <div class="violeta violeta--2"></div>

  </div>

  <style>
    div>div {
      width: 250px;
      height: 250px;

    }

    .padre {
      position: relative;
      width: 500px;
      height: 500px;
      background-color: pink;
      display: grid;
      place-content: center;
      outline: 5px solid blue;
    }

    .violeta {
      background-color: purple;
      position: absolute;
      bottom: 0;
      right: 0;
    }



    .violeta--2 {
      top: 0;
      left: 0;
    }

    .rosa {
      background-color: tomato;
      margin: auto;
    }
  </style>
</body>

</html>
