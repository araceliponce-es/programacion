<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZA RIA</title>
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-element-bundle.min.js"></script>
  <link rel="stylesheet" href="./css/styles.css">

  <style>
    :root {
      --color-text: #393634;
      --color-primary: #ad782c;
      --color-border: rgba(50, 45, 40, 0.17);

      --opacity-placeholder: 0.48;
      --opacity-secondary: 0.65;
      --opacity-disabled: 0.35;

      --color-error: #c0392b;
      --color-success: #32865b;

      --radius: 9px;
    }

    /* FORMULARIO */

    .reservation-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      color: var(--color-text);
      font-family: Arial, sans-serif;
    }

    /* GRUPOS */

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    /* LABELS */

    .form-group>label {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.1px;
    }

    .form-group>label span {
      color: var(--color-primary);
    }

    /* INPUTS Y SELECTS */

    .form-group input:not([type="checkbox"]),
    .form-group select,
    .form-group textarea {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;

      padding: 11px 15px;

      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }


    /* PLACEHOLDERS */

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--color-text);
      opacity: var(--opacity-placeholder);
    }

    /* FOCUS */

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(173, 120, 44, 0.10);
    }

    /* TELÉFONO */

    .phone-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      min-width: 0;
    }

    .phone-group select {
      cursor: pointer;
    }

    /* CAMPOS DESHABILITADOS */

    .form-group select:disabled {
      opacity: var(--opacity-disabled);
      cursor: not-allowed;
      background-color: #fafafa;
    }

    /* FECHA */

    input[type="date"] {
      cursor: pointer;
    }

    /* TEXTAREA */

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* CONTADOR */

    .counter {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;

      border: 1px solid var(--color-border);
      border-radius: var(--radius);

      overflow: hidden;
      height: 41px;
    }

    .counter button {
      height: 100%;
      border: none;
      background: transparent;
      color: var(--color-text);
      font-size: 17px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .counter button:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .counter input {
      border: none !important;
      box-shadow: none !important;
      text-align: center;
      padding: 0 !important;
      appearance: textfield;
    }

    .counter input::-webkit-inner-spin-button,
    .counter input::-webkit-outer-spin-button {
      appearance: none;
    }

    /* PRIVACIDAD */

    .privacy-group {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .privacy-group input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .privacy-group label {
      font-size: 15px;
      opacity: var(--opacity-secondary);
      cursor: pointer;
    }

    .privacy-group a {
      color: var(--color-primary);
      text-decoration: none;
      opacity: 1;
    }

    .privacy-group a:hover {
      text-decoration: underline;
    }

    /* MENSAJES DE VALIDACIÓN */

    .error-message {
      display: none;
      color: var(--color-error);
      font-size: 12px;
      opacity: 0.9;
      line-height: 1.4;
    }

    .form-group.invalid .error-message {
      display: block;
    }

    .form-group.invalid input:not([type="checkbox"]),
    .form-group.invalid select,
    .form-group.invalid textarea {
      border-color: rgba(192, 57, 43, 0.65);
    }

    /* VALIDACIÓN CORRECTA */

    .form-group.valid input:not([type="checkbox"]),
    .form-group.valid select {
      border-color: rgba(50, 134, 91, 0.5);
    }

    /* BOTÓN */

    #submitButton {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: var(--radius);

      background-color: var(--color-primary);
      color: white;

      font-size: 14px;
      font-family: inherit;

      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    #submitButton:disabled {
      background-color: #d8d8d8;
      color: rgba(50, 45, 40, 0.3);
      cursor: not-allowed;
    }

    #submitButton:not(:disabled):hover {
      background-color: #94621e;
    }

    /* RESPONSIVE */

    @media (max-width: 600px) {

      .reservation-form {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .full-width {
        grid-column: auto;
      }

      .phone-group {
        gap: 10px;
      }

    }

    .touched:invalid {
      outline: 2px solid red;
    }
  </style>
</head>

<body>

  <header class="header--fixed">
    <nav>
      <ul>
        <li><a class="logo" href="/">RIA</a></li>
        <li class="ms-auto"><a href="menu.html">menu</a></li>
        <li><a href="reserva.html">reserva</a></li>
      </ul>
    </nav>
  </header>




  <main>


    <form id="reservationForm" class="reservation-form" novalidate>

      <!-- Nombre -->
      <div class="form-group full-width">
        <label for="nombre">NOMBRE Y APELLIDO <span>*</span></label>

        <input class="input" type="text" id="nombre" name="nombre" placeholder="Pepito Pérez" autocomplete="name" required minlength="3" maxlength="80">

        <small class="error-message" id="nombreError">
          Introduce tu nombre y apellido.
        </small>
      </div>

      <!-- Teléfono -->
      <div class="form-group">
        <label for="telefono">TELÉFONO <span>*</span></label>

        <div class="phone-group">
          <select id="prefijo" name="prefijo">
            <option value="+34">🇪🇸 +34 España</option>
            <option value="+33">🇫🇷 +33 Francia</option>
            <option value="+44">🇬🇧 +44 Reino Unido</option>
            <option value="+49">🇩🇪 +49 Alemania</option>
            <option value="+351">🇵🇹 +351 Portugal</option>
          </select>

          <!-- Solo permite números entre 9 y 15 dígitos. porque input type tel permite letras -->
          <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9,15}" placeholder="600 000 000" autocomplete="tel-national" required maxlength="15">
        </div>

        <small class="error-message" id="telefonoError">
          Introduce un teléfono válido.
        </small>
      </div>

      <!-- Fecha -->
      <div class="form-group">
        <label for="fecha">FECHA <span>*</span></label>

        <input type="date" id="fecha" name="fecha" required>

        <small class="error-message" id="fechaError">
          Selecciona una fecha válida.
        </small>
      </div>

      <!-- Hora -->
      <div class="form-group">
        <label for="hora">HORA <span>*</span></label>

        <select id="hora" name="hora" required disabled>
          <option value="">Selecciona una fecha primero</option>
        </select>

        <small class="error-message" id="horaError">
          Selecciona una hora disponible.
        </small>
      </div>

      <!-- Número de personas -->
      <div class="form-group full-width">
        <label for="personas">NÚMERO DE PERSONAS</label>

        <div class="counter">
          <button type="button" id="restarPersonas" aria-label="Restar una persona">-</button>

          <input type="number" id="personas" name="personas" value="1" min="1" max="20" readonly>

          <button type="button" id="sumarPersonas" aria-label="Añadir una persona">+</button>
        </div>
      </div>

      <!-- Notas -->
      <div class="form-group full-width">
        <label for="notas">NOTAS ESPECIALES (Opcional)</label>

        <textarea id="notas" name="notas" placeholder="Aquí alergias, ocasiones especiales, preferencia de mesa" rows="3" maxlength="500"></textarea>
      </div>

      <!-- Política de privacidad -->
      <div class="form-group full-width">
        <div class="privacy-group">
          <input type="checkbox" id="privacidad" name="privacidad" required>

          <label for="privacidad">
            He leído y acepto la
            <a href="/politica-privacidad" target="_blank">
              política de privacidad
            </a>
          </label>
        </div>

        <small class="error-message" id="privacidadError">
          Debes aceptar la política de privacidad.
        </small>
      </div>

      <!-- Enviar -->
      <div class="form-group full-width">
        <button type="submit" id="submitButton" disabled>
          CONFIRMAR RESERVA
        </button>
      </div>

    </form>
  </main>

  <script>
    document.querySelectorAll("input, select").forEach(element => {

      element.addEventListener("blur", () => {
        element.classList.add("touched");
      });

    });
  </script>
</body>

</html>
