<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloque 8 - Formularios</title>

  <style>
    body {
      padding-top: 2rem;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body>



  <main>

    <form action="#" method="POST">

      <!-- SECCION 1 -->
      <fieldset>
        <legend>Datos personales</legend>

        <div>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Introduce tu nombre">
        </div>

        <div>
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        </div>

        <div>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password">
        </div>

        <div>
          <label for="edad">Edad (no acepta menor A 1 O MAYOR A 100):</label>
          <input type="number" id="edad" name="edad" min="1" max="100">
        </div>

      </fieldset>

      <!-- SECCION 2 -->
      <fieldset>
        <legend>Preferencias</legend>

        <div>
          <label for="experiencia">Experiencia:</label>

          <input type="range" id="experiencia" name="experiencia" min="1" max="5" list="niveles">
          <datalist id="niveles">
            <option value="1" label="Principiante"></option>
            <option value="2"></option>
            <option value="3" label="Intermedio"></option>
            <option value="4"></option>
            <option value="5" label="Avanzado"></option>
          </datalist>
        </div>

        <div>Modalidad:</div>

        <input type="radio" id="presencial" name="modalidad" value="presencial">
        <label for="presencial">Presencial</label>

        <input type="radio" id="online" name="modalidad" value="online">
        <label for="online">Online</label>

        <input type="radio" id="mixta" name="modalidad" value="mixta">
        <label for="mixta">Mixta</label>

        <div>
          <input type="checkbox" id="notificaciones" name="notificaciones" value="si">
          <label for="notificaciones">
            Quiero notificaciones en mi e-mail.
          </label>
        </div>

        <div>
          <label for="tecnologia">Tecnología favorita:</label>

          <select id="tecnologia" name="tecnologia">

            <optgroup label="Frontend">
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="javascript">JavaScript</option>
            </optgroup>

            <optgroup label="Backend">
              <option value="php">PHP</option>
              <option value="java">Java</option>
              <option value="nodejs">Node.js</option>
            </optgroup>

          </select>
        </div>

        <div>
          <label for="comentarios">Mensaje:</label>
          <br>

          <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Escribe aquí tus comentarios..."></textarea>
        </div>

      </fieldset>

      <div>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar todo</button>
      </div>

    </form>

  </main>

</body>

</html>
